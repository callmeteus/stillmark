name: Deploy GitHub Pages

on:
    push:
        branches:
            - master
        paths-ignore:
            - "index.html"
            - "install.md"
            - "pt-br/**"
            - "_astro/**"
            - "sitemap-*.xml"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        name: Build Astro and publish static files to master root
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build landing page
              env:
                  PUBLIC_STILLMARK_GITHUB: https://github.com/callmeteus/stillmark
              run: npm run build -w @stillmark/landing-page

            - name: Verify static Pages artifact
              run: npm run verify -w @stillmark/landing-page

            - name: Merge dist into master root for Pages
              run: |
                  set -e
                  DIST=packages/landing-page/dist
                  cp "$DIST/index.html" .
                  cp "$DIST/install.md" .
                  cp "$DIST/.nojekyll" .
                  rm -rf _astro pt-br
                  cp -r "$DIST/_astro" .
                  cp -r "$DIST/pt-br" .
                  cp "$DIST"/sitemap-*.xml . 2>/dev/null || true
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add index.html install.md .nojekyll _astro pt-br sitemap-index.xml sitemap-0.xml
                  if git diff --staged --quiet; then
                    echo "No static site changes to publish"
                  else
                    git commit -m "chore(t): atualiza arquivos estáticos do GitHub Pages"
                    git push
                  fi
