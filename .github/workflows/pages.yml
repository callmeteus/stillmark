name: Deploy GitHub Pages

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        name: Build Astro and publish static site
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build landing page
              env:
                  PUBLIC_STILLMARK_GITHUB: https://github.com/callmeteus/stillmark
              run: npm run build -w @stillmark/landing-page

            - name: Verify static Pages artifact
              run: npm run verify -w @stillmark/landing-page

            - name: Publish to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: packages/landing-page/dist
                  publish_branch: gh-pages
                  force_orphan: true
                  enable_jekyll: false
